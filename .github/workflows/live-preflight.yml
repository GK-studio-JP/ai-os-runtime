          (out / "boot.json").write_text(
              json.dumps(boot, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          print("WORKER_BOOT_OK", boot["dispatch_count"])
          PY
      - name: Refresh selected canonical task
        shell: bash
