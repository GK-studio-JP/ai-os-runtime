name: bootstrap runtime

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import urllib.request

          url = "https://api.github.com/repos/kj2whvbzjn-hue/browser-agent/issues/85"
          with urllib.request.urlopen(url) as response:
              body = json.load(response)["body"]

          marker = "AIOS_BOOTSTRAP_PAYLOAD_V1\n"
          payload = body.split(marker, 1)[1].strip()
          with open("/tmp/runtime.tar.gz", "wb") as handle:
              handle.write(base64.b64decode(payload))
          PY
          tar -xzf /tmp/runtime.tar.gz
          rm -f .github/workflows/bootstrap.yml
      - name: Commit runtime implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bootstrap AI OS runtime v0.1"
          git push
